<section id="quant" class="page"><article><h2>港股 / 比特币量化研究</h2><p class="hint">使用真实历史行情进行模拟交易。港股连接富途；比特币通过 CCXT 获取现货行情，无需交易所密钥。只做多、无杠杆，支持均线交叉参数配置。</p><div class="pattern-fields">
